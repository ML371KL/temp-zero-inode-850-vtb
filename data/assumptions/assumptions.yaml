                                                               #   концы — той же формой, что центр (шаг deductions листа вывода; решение № 3, п. 6.2): связка ведёт все ключи обеих частей пути
                                                               #   вычета четырёх сценариев (рубли deduction_rub и п.п. deduction_pp: кварталы 2026–2028, годы 2029–2036 и LT). На тех же ключах
                                                               #   стоит связка доли вычета якоря (решение № 4, п. 3.3): приращения осей
                                                               #   на общем пути складываются (MODEL §10). Высвобождение вычета осью не водится — цена справочными вариантами dta_release_*
      - {name: "Дрейф плотности RWA до 2027 года (−5,6…0 % в год; центр −2,8)", kind: value, paths: [capital.rwa.density_drift_rate], low: -0.056, high: 0.0, dist: triangular, unit: pct}
                                                               # лист calib-capital/r2: низ — факт за 12 месяцев до якоря без разовой секьюритизации, верх — канал закрыт
      - {name: "Ставка новых выпусков добавочного капитала: ключевая своего мира + 3…5 п.п. (центр 4)", kind: value, paths: [capital.at1_share.spread], low: 0.03, high: 0.05, dist: triangular, unit: pp}
                                                               # решения ведущего № 7, п. 2.1 и № 8, п. 1.2: рублёвые выпуски 2025–2026 годов по ключевой + 5 % и 19,5 %
      - {name: "Надбавка за субординацию дополнительного капитала к ставке опта (2…3 п.п.; центр 2,5)", kind: value, paths: [capital.n20.t2_premium.spread], low: 0.02, high: 0.03, dist: triangular, unit: pp}
                                                               # решения ведущего № 7, п. 2.2 и № 8, п. 1.2
      - {name: "Распределения по указанию акционера вне дивиденда (0…−50 млрд ₽ в год)", kind: shift, paths: [equity.other_movements], low: -6.25, high: 6.25, dist: triangular, unit: bn}
                                                               # сдвиг траектории, млрд ₽ за квартал; центр −25 в год (устав); сдвиг LT с ключом прочих движений терминала
                                                               #   (flat_rub) двигает и терминал — решение № 7, п. 2.3
      - {name: "Выпуск акций по 87 ₽: доля денег, которая создаёт стоимость — приходит в банк и в капитал норматива (0…100 %; центр 50 %)", kind: bundle, paths: [equity.other_movements.2026Q4], low: {equity.other_movements.2026Q4: 18.35}, high: {equity.other_movements.2026Q4: 343.35}, dist: triangular, unit: bn}
                                                               # решение ведущего № 4, п. 3.1: ось ведёт ПРИТОК квартала выпуска (0 … 325 млрд ₽ денег, которые создают стоимость, + поправки потока);
                                                               #   акции выпущены все на обоих концах; низ — ни один рубль стоимости не создаёт, верх — все деньги в банке и в капитале норматива.
                                                               #   Концы — шаг issue листа вывода, равны вариантам issue_325_stay_0 и issue_325_stay_100. Ключей вычета связка больше не несёт
      - {name: "Выпуск акций по 87 ₽: объём (0…547,5 млрд ₽; центр 325)", kind: bundle, paths: [valuation.share_count_adj, equity.other_movements.2026Q4], low: {valuation.share_count_adj: 0.0, equity.other_movements.2026Q4: 18.35}, high: {valuation.share_count_adj: 0.486754, equity.other_movements.2026Q4: 292.08}, dist: triangular, unit: bn}
                                                               # решение ведущего № 4, п. 3.1: приток квартала выпуска — доля денег × объём (с возвратом купона 24,6 и распределениями −6,25), акции —
                                                               #   объём / 87 (поправка делителя — число оси книги). Концы притока — шаг issue листа вывода, равны вариантам issue_none и
                                                               #   issue_max_stay_50: знак оси совпадает со знаком вариантов
      - {name: "Доля выплаты избытка капитала ε (0…1)", kind: value, paths: [dividends.excess.epsilon], low: 0.0, high: 1.0, dist: triangular, unit: share}
                                                               # лист calib-capital/r2 (необязательная ось): наблюдения ε у ВТБ нет — весь отрезок
      - {name: "Выплата: отклонение цели от пути книги (до −25 п.п.: цель 25 %, за 2026 год — 0)", kind: shift, paths: [dividends.payout_deviation], low: -0.25, high: 0.0, dist: triangular, unit: pp}
                                                               # устав: цель 50 % при достаточном капитале, пол 25 %; при выплате остатком ось водит ЦЕЛЬ, а не пол (лист calib-capital/r2, необязательная ось)
      - {name: "β_E", kind: value, paths: [valuation.beta_e], low: 0.75, high: 1.2, dist: triangular, unit: number}
      - {name: ERP, kind: value, paths: [valuation.erp], low: 0.049, high: 0.062, dist: triangular, unit: pct}
      - {name: "Реальный рост терминала", kind: value, paths: [valuation.terminal.real_growth], low: 0.005, high: 0.025, dist: triangular, unit: pct}
      - {name: "Угасание избыточной доходности", kind: value, paths: [valuation.terminal.fade], low: 0.25, high: 1.0, dist: triangular, unit: number}
      - {name: "Постоянные в рублях части за концом сетки: доля, растущая с бизнесом, λ_F (0…1; центр 0)", kind: value, paths: [valuation.terminal.fixed_growth_share], low: 0.0, high: 1.0, dist: triangular, unit: share}
                                                               # решение ведущего № 4, п. 3.8 и дополнение 5.1: центр 0 — нейтральная середина (постоянные части стоят в рублях),
                                                               #   1 — соглашение образца (растут с g_T); медиана суждения — значение книги (MODEL §10): половина прогонов полосы — при 0
      - {name: "Веса миров", kind: dict, paths: [joint.world_prob], low: {"N": 0.25, H: 0.5, M: 0.25}, high: {"N": 0.4, H: 0.45, M: 0.15}, dist: triangular}
