# Метки в комментариях:
#   [Ф]  — факт с источником (документ, страница); [Р] — расчёт по фактам (лист); [В] — суждение (правило центра — устав и решения).
#   Метка с текстом после двоеточия у ключа, на котором стоит ось полосы, — источник суждения для витрины (не длиннее 80 знаков).
#   null — только там, где ядро ключ не читает (выключенный блок, ключ неактивного режима календаря дивидендов, хэш сборки).
#   "anchor" — значение выводится из фактов якоря (data/facts/*.json) при загрузке книги (формула — MODEL прил. A).
#   ВЫВЕДЕНО НА ЯДРЕ <дата> — число следует из суждения книги и из решения передачи ставки либо из пути баланса клеток: его
#          выводит лист data/assumptions/evidence/path/derive_on_engine.py одной командой python -B ops/tools/rederive.py
#          (шаги, ключи записи, точность и коридоры разумного — derive_spec.py рядом с листом). «ВЫВОДИТСЯ НА ЯДРЕ» без даты —
#          число ещё стартовое. При смене суждения команда запускается заново.
# Единицы: деньги — млрд ₽; акции — млн шт.; ставки, темпы, доли — доли единицы, годовые; п.п. — тоже доли (0,001 = 0,1 п.п.).
