#     до 4К2028 — 368,0 млрд ₽ якоря во всех клетках, с 1К2029 AT1_c,q = (AT1_c,4К2028 / RWA_c,4К2028) × RWA_c,q; прирост над базой — по
#     ставке новых выпусков своего мира: ключевая + 4 п.п. (ось 3…5 п.п.), после налога; в K20, не в K11; деньги выпуска приходят в своём
#     квартале (согласованная форма, решение № 8, п. 1.1); «AT1 рублями якоря» — вариант at1_anchor_rub (ключ выключен);
#   capital.n20.t2_premium {enabled: true, spread: 0.025, base: anchor} — надбавка за субординацию T2 на весь прирост над 339,1 млрд ₽
#     якоря: ставка опта + 2,5 п.п. (ось 2…3 п.п.), до налога; «без надбавки» — вариант t2_premium_off (ключ выключен);
#   valuation.terminal.other_movements: flat_rub — распределения по указанию акционера (equity.other_movements, LT −6,25 за квартал =
#     −25 млрд ₽ в год) за концом сетки постоянно в номинальных рублях: OM_ann / k_T в TV_RI и P_T (без роста, удержания и угасания);
#     «кончаются в 2036 году» (соглашение образца) — вариант om_terminal_none; «индексируются» (индекс цен своего мира) книгой не
#     выражается — цена оценкой в отчёте круга. Оси распределений (сдвиг траектории, варианты shareholder_distributions_*) с ключом
#     двигают и терминал. Формы терминала К1 и К2 (купон якоря и освобождение базы растут с g_T за T: −0,11 и −0,20 ₽) — в «чего не
#     считает» (решение № 8, п. 1.3). До первого реального переноса якоря база AT1 и слот купона якоря решаются вместе по фактам нового
#     якоря; надбавка T2 в реальных процентах — правило фактов (решение № 8, п. 1.4).
# КНИГА 0.6 — РЕШЕНИЯ ВЕДУЩЕГО № 6 (notes/LEAD-DECISIONS-6.md, раздел 2 и дополнение 4; правила заданы до счёта шестого круга) на ядре
#   шестого и седьмого проходов (ветки core/pass6 и core/pass7 слиты: база объёма iea квартала фактов в определении клетки — MODEL §4.7;
#   дополнительный капитал держит долю RWA своей клетки — ключ capital.n20.t2_share, MODEL §4.11, прил. A № 30):
#   п. 2.1 — capital.n20.t2_share {enabled: true, from: 2029Q1}: с 1К2029 T2 каждой клетки — её доля RWA конца 2028 года; варианты
#     t2_flat_rub, t2_amortizing — с выключенным ключом; «рубли модальной клетки» (форма книги 0.5) — вариант t2_modal_rub;
#   п. 2.2 — прочие доходы 2028–2029 годов: прямая к LT от пары к пути без встречной σ0 (ключ 2027 года минус разность пар; ключи пишет
#     команда); оси ключа 2027 года и LT — связки, ведущие ключи 2028–2029 годов той же прямой; то же у вариантов ближнего пути маржи;
#     наследование пары к сдвигу d оставлено — развилка misc_near_d_pair_off (КНИГА 0.7: правило заменено решением № 7, п. 2.4);
#   п. 2.3 — маржа 2027 года судится на режиме «нормализация», смесь рядом (строка 1(а) листа приёмки facts_check.py);
#   п. 2.4 — сторож checks.roe_k_spread.max_world_gap — правилом листа на мере гейта roe_k_homogeneity.
# КНИГА 0.5 — РЕШЕНИЯ ВЕДУЩЕГО № 5 (notes/LEAD-DECISIONS-5.md, раздел 3; правила заданы до счёта пятого круга; ядро не меняется):
#   п. 3.1 — рост вычетов 2026–2028 по природе на обеих сторонах: доля η (ОНА и гудвил) — и в пути постоянной части прочих активов
#     (volumes.other_assets_fixed_change, той же суммой в том же квартале, вес 0); «регуляторный счёт» — вариант ded_growth_regulatory;
#   п. 3.3 — «послабление» после возврата надбавок: регуляторный вычет — смесь 0 / 0,3 / 0,6 п.п. той же долей возврата;
#   п. 3.4 — реализованная передача −0,0115 (произведение середин без округления); ось — P10 и P90 произведения двух суждений;
#   п. 3.5 — ближний сдвиг маржи снимает ступень σ0 на границе 2026К4 → 2027К1 и линейно сходит к 2028 году; ключ прочих 2027 года —
#     пара к ближнему пути маржи; варианты ближнего пути — с ключом, выведенным парой. Всё — шагами листа вывода одной командой.
