                                                               #     (оценка) = 123,7; × 12/8 = 185,5; без убытка от выбытия дочерней компании (−8,7) — 198,6 → 195;
                                                               #   2027 — [Р] ВЫВЕДЕНО НА ЯДРЕ 14.10.2026 — ПАРА К БЛИЖНЕМУ ПУТИ МАРЖИ; СЕРЕДИНА ОКНА C (решение ведущего № 5, п. 3.5:
                                                               #     перевыводится после ближнего сдвига маржи; варианты ближнего пути маржи несут ключ, выведенный парой к их пути) —
                                                               #     РЕШЕНИЕ ВЕДУЩЕГО № 4, п. 3.6 (заменяет число 130 решения № 2, п. 1.3; правило устава
                                                               #     «центр — середина»): уровень, при котором сумма «ЧПД + прочие (определение банка)» 2027 года в клетке «мир M × нормализация»
                                                               #     (условия окна — правило решения № 3, п. 6.1), в знаменателе окна разбора (с денежными средствами, страховой строкой и резервами
                                                               #     не по кредитам — форма строки (б) листа приёмки), равна середине окна C устава (1К–2К + июль–август 2026 года; без
                                                               #     результата 1К2026 в 100,8 — 2,67 %, с ним — 3,12 %; середина 2,895 %). Шаг misc листа вывода (пишет команда перевывода).
                                                               #     2028 и 2029 — [Р] шаг misc листа (пометка вывода — у ключа выше) — ПРЯМАЯ К LT ОТ ПАРЫ К ПУТИ ЦЕНТРА БЕЗ ВСЕХ ПЕРЕХОДНЫХ
                                                               #     ЧАСТЕЙ 2027 ГОДА (решение ведущего № 7, п. 2.4 — «пара к переходной части пути ЧПД сходит вместе с ней»; находка B-1 шестого
                                                               #     круга, «два пути одного суждения»; отменяет оговорку решения № 6, п. 2.2 о сдвиге d): ключ 2027 года вбирает все переходные
                                                               #     части пути ЧПД 2027 года, а с 2028К1 их в ЧПД нет — унаследованная прямой пара записывала их второй раз. Части (снятие
                                                               #     накопительно, лист печатает пару каждой): встречная σ0; сдвиг d 2027 года (d года якоря остаётся); половина остатка якоря
                                                               #     каждой книги с ключом года (юрлица, ипотека, потребкредиты, ликвидность, срочные вклады, средства юрлиц; у текущих счетов
                                                               #     остатка нет); остаток книги бумаг — тем же счётом, что пишет её ключи (путь бэктеста на ключевой мира H, обращение лага: ключи
                                                               #     по кварталам при доле остатка 2027 года 0,5 и 0); сход спреда опта (2027 год — LT). Начало прямой — ключ 2027 года минус
                                                               #     разность пар (сумма пар по частям); ключи пишет команда (шаг misc листа; сверка — ЧПД 2028 года клетки окна в обеих формах
                                                               #     совпадает до второго порядка). Форма книги 0.6 (минус одна пара к встречной σ0) — вариант misc_near_pairs_inherited.
                                                               #     Путь по мирам — развилкой («мир N — ноль с 2028 года»; «N и H — ноль с 2027»): ядро держит одну траекторию на все миры,
                                                               #     справочным вариантом книги развилка не выражается — цена в записи листа (ends.misc_forks)
                                                               #   Оси: уровень −65…+70 — на ключе LT; ближний 2027 год — от суммы окна C без разового результата 1К до суммы с ним, тоже парой к
                                                               #     марже (концы выводит шаг misc). Обе оси — СВЯЗКИ (решения № 6, п. 2.2 и № 7, п. 2.4; MODEL §10): ведут ключи 2028–2029 годов
                                                               #     долями прямой (ось ключа 2027 года — 2/3 и 1/3 его приращения: разность пар вдоль оси постоянна; ось LT — 1/3 и 2/3), так что
                                                               #     в полосе 2028–2029 — прямая от разыгранного ключа 2027 года минус разность пар к разыгранному LT
  misc_quarter_shares: {"1": 0.25, "2": 0.25, "3": 0.25, "4": 0.25}   # доли кварталов в годовой сумме «прочего» (Σ = 1) [Р: лист calib-pnl]: без четырёх крупных результатов 4-го и 1-го
                                                               #   кварталов сезонности нет → ровный профиль
  fvtpl_bond_reval: false                                      # выключатель: переоценка облигаций через прибыль или убыток — в уровне «прочего»; от пути ставок мира не
                                                               #   моделируется — ограничение книги
pnl:
  nci_share: 0.034                                             # без изменений к кругу 1 [Р: Доля меньшинства в прибыли группы: от 2,7 % в 2023 до 4,0 % в начале 2026 года]

tax:
  statutory: {"2026": 0.25, LT: 0.25}                          # законная ставка по годам [Ф: Ставка налога на прибыль 25 % с 2025 года (закон 176-ФЗ)]
                                                               #   по этой же ставке ядро считает купон бессрочных после налога и фонд переоценки
  effective_gap: -0.05                                         # эффективная − законная, ОДНО число на все годы и миры (схема: NUM) [Р/В: Эффективная ставка 19,4 % за полугодие и 20,2 % за восемь месяцев 2026 года] (решение № 2, п. 3.3)
                                                               #   РАЗРЫВ СТРУКТУРНЫЙ, признанием отложенного актива не держится (лист r2/sheets/tax_gap_decomposition.csv,
                                                               #   сверка налога МСФО 6М2026, прим. 8): прибыль по другим ставкам −6,35 п.п. (17,8 млрд ₽ = 5 п.п. × процентный
                                                               #   доход по облигациям 356: купон гособлигаций и облигаций российских эмитентов облагается по 20 %, НК ст. 284
                                                               #   п. 4); прочее −1,46 п.п. (в нём налоговая экономия купона бессрочных ≈ −1,66: 25 % × 18,6); необлагаемые
                                                               #   доходы −0,50; невычитаемые расходы +1,93; изменение непризнанного отложенного актива +0,82 (ПРОТИВ знака).
                                                               #   Без отложенного актива ставка 18,6 % (разрыв −6,4). Правило уровня: разрыв = −0,05 × доход по облигациям /
                                                               #   прибыль до налога − 0,25 × купон бессрочных / прибыль до налога + 1,6…2,2 п.п. прочих постоянных разниц.
                                                               #   По мирам после 2029 года (ориентир на неизменённом ядре, доля бумаг якоря): N −2,6…−3,4; H −3,5…−5,0;
                                                               #   M −5,5…−8,5 п.п.; взвешенно −4,3 («свой взгляд») и −5,9 (вменённые рынком). Центр −0,05 сохранён;
                                                               #   ось −0,08…−0,03 (диапазон по мирам; в круге 1 −0,10…−0,02). После 2028 года ключ НЕ меняется: причины
                                                               #   менять его во времени в сверке нет. Налоговая экономия купона бессрочных сидит ЗДЕСЬ — узел фактов
                                                               #   capital.at1.coupon_annual обязан быть 67,1 (= 50,4 / 0,75), иначе экономия считается дважды (12,6 в год)
  one_off: {year: 2027, amount: 60.0, prob: 0.0}               # без изменений к кругу 1 [В: Суждение книги: разовое изъятие около 12 % годовой прибыли, вероятность 0]

# ------------------------------------------------------------------ OCI И ПРОЧИЕ ДВИЖЕНИЯ КАПИТАЛА
oci:
  fvoci_share: anchor                                          # доля бумаг через прочий совокупный доход в долговых бумагах: (2 130,5 + 481,3 в репо) / 6 169,1 = 0,423
  fvoci_duration: 0.55                                         # эффективная дюрация к ОФЗ 3 лет, лет [Р: Переоценка облигаций ВТБ против доходности ОФЗ в 2024–2026 годах: 0,4–0,7 года]
  fvoci_maturity: 3.0                                          # срок подтягивания к номиналу, лет [В/Р: Суждение: сроки облигаций в обобщённой отчётности не раскрыты]
  fvoci_tenor: ofz_3y                                          # узел кривой мира для переоценки
  fvtpl_bond_share: anchor                                     # доля облигаций через прибыль или убыток в долговых бумагах — из фактов якоря
  fvtpl_bond_duration: null                                    # не читается при other.fvtpl_bond_reval: false
equity:
  other_movements: {"2026Q3": -6.25, "2026Q4": 180.85, "2027": -6.25, LT: -6.25}   # прочие движения капитала, млрд ₽ за квартал; три слагаемых:
                                                               #   (1) распределения по указанию акционера вне дивиденда: −25 в год = −6,25 за квартал [В: Распределения акционеру вне дивиденда за 2023–2026 годы: −25 млрд ₽ в год]
                                                               #       за концом сетки — те же рубли постоянно (ключ valuation.terminal.other_movements: flat_rub, решение № 8, п. 1.2);
                                                               #       (устав — среднее наблюдений −1,2, −1,5, −91,4, −8,6 = −25,7); ось 0…−50 в год — r2/axes.yaml;
                                                               #   (2) зарегистрированный выпуск по 87 ₽: ДОЛЯ ДЕНЕГ × ОБЪЁМ = 0,5 × 325 = 162,5 в 4К2026 [В] (устав: объём — середина
                                                               #       нижней половины ориентира 300–400; доля денег, которая создаёт стоимость, — 50 %, ось 0…100 %).
                                                               #       [Р] ВЫВЕДЕНО НА ЯДРЕ 14.10.2026 — решение ведущего № 4, п. 3.1: выпуск записан ОДНИМ МЕСТОМ на обе стороны —
                                                               #       часть денег, которая по суждению стоимости не создаёт (вторая половина: по пересказу Reuters 27.05.2026 —
                                                               #       миноритарные пакеты финтех-активов; источник вторичный), вносит в оценку ровно ноль: не приходит на баланс
                                                               #       и не трогает капитал норматива; акции выпущены все (325 / 87 = 3 735,6 млн — valuation.share_count_adj).
                                                               #       Шаг issue листа вывода (пишет команда перевывода; концы связок осей и приток вариантов — той же формой).
                                                               #       Чтение «вложение стоит своей цены» книгой не выражается (ядро не прибавляет стоимость вне баланса клетки):
                                                               #       его цена — арифметикой, +162,5 × 1000 / 16 663,4 = +9,75 ₽ к центру (запись листа: issue.asset_at_price).
                                                               #       Это НЕ взнос модели (определение E2): объявленный выпуск с известной ценой остаётся значениями книги;
                                                               #   (3) ВОЗВРАТ ЛИШНЕГО КУПОНА 2026 года: +24.6 в 4К2026 [Р: слот ядра вычитает годовой купон 50,4 в 4-м квартале каждого
                                                               #       года, включая 2026-й, а купоны 1-го полугодия (18,6) уже вычтены из капитала якоря; купон 2-го полугодия
                                                               #       по расписанию выпусков — 25.8: 50,4 − 25.8 = 24.6; r2/sheets/at1_coupon_bridge_r2.csv].
                                                               #       Узлом фактов это не выразить: ядро читает одну константу at1.coupon_annual на все годы (model/cell.py:911).
                                                               #   Ключ 2026Q4 = 0,5 × 325 − 6,25 + 24,6 = 180,85 (книга 0.3: 343,35 — все 325 на балансе с доходом, половина вычиталась
                                                               #   из капитала норматива — одно суждение двумя путями, находка A-1 третьего круга)

# ------------------------------------------------------------------ КАПИТАЛ И НОРМАТИВЫ (A-K*b) — лист calib-capital/r2
# Оба слота — нормативы банковской группы (форма 0409805, рег. № 1000): n20_0 — Н20.0 (10,66 % на 01.07.2026, ДО вычета
# дивиденда за 2025 год), n1_1 — Н20.1 (7,26 %). Якорь воспроизводится по построению (шаг anchor листа вывода).
# Центр: рост вычетов 0,1 п.п. за квартал до конца 2028 года и высвобождение с 2029 года; выпуск 325 по 87 ₽, в оценку входит
# половина денег (решение № 4, п. 3.1: приток 162,5, акции — все); до 2028 года включительно — график Банка России в трёх сценариях; четвёртый — «послабление» в кризисе (0,70 в строке кризиса).
# Вычеты якоря: доля 0,6065 — постоянная в рублях (ОНА и гудвил), остальное растёт с RWA (решение ведущего № 3, раздел 2; MODEL §4.11).
capital:
  minimum: {n20_0: 0.08, n1_1: 0.045}                          # минимум Н20.0 и Н20.1 банковской группы [Ф: Инструкция Банка России 220-И, п. 2.2]
  mgmt_buffer: {n20_0: 0.005, n1_1: 0.005}                     # запас менеджмента над минимумом сценария [В: Цель банка 0,3–0,5 п.п., факт запаса над полом 0,3–1,2 п.п.; центр 0,5 п.п.] (устав; ось 0,3…0,9 п.п. — r2/axes.yaml)
                                                               #   цель банка 0,3–0,5 п.п.; факт запаса Н20.0 над полом на отчётные даты 0,34–1,17 п.п. (лист calib-capital/r2, sheets/headroom_history.csv)
  reg_scenarios:                                               # надбавки по годам, доли RWA; ключ года действует с проверки на конец 1-го квартала (отчётная дата 1 апреля)
    ids: [schedule, mid, strict, relief]
    #   ДО 2028 ГОДА ВКЛЮЧИТЕЛЬНО — ГРАФИК БАНКА РОССИИ ВО ВСЕХ СЦЕНАРИЯХ [Ф: 220-И, пп. 3.2, 3.4; решения Банка России 08.11.2024 и
    #   27.07.2026]: пол Н20.0 10,0 % (2026) → 10,75 % (2027) → 12,0 % (2028); пол Н20.1 6,5 → 7,25 → 8,5 %. Сценарии расходятся
    #   с 2029 года [В: решение ведущего B6; устав]: schedule 12,0 %; mid 13,0 (2029) → 13,5 % (с 2030); strict 13,0 → 13,5 → 14,0 % (с 2031).
    #   Четвёртый сценарий «послабление в кризис» [В: решения ведущего № 2, п. 4.1 и № 3, п. 5.5; лист calib-capital/r2,
    #   crisis_relief_option.yaml] — В ЦЕНТРЕ (блок relief ниже; ядро второго прохода: число клеток — произведение порядков перечней): надбавки
    #   обнуляются в год шока и следующий, затем возвращаются за пять лет — прецедент 2022–2028 годов [Ф: решения Банка России; слайды банка —
    #   research/vtb-capital-shares.md §3.3]: 0,25 (2024) → 1,25 (2025) → 2,0 (2026) → 2,75 (2027) → 4,0 п.п. (2028), сдвинутый на год шока книги (2027).
    #   ВЫЧЕТ СЦЕНАРИЯ — ПО ПРИРОДЕ СЛАГАЕМЫХ [В: решение ведущего № 3, п. 6.2 — то же суждение, что доля вычета якоря, постоянная в рублях]
    #   на ключах пятого прохода ядра (решение ведущего № 4, раздел 4, К1; MODEL §4.11): суммы в рублях — ключом deduction_rub (млрд ₽;
    #   прибавляются к вычету без множителя RWA — рубли не растут с RWA клетки), растущая и регуляторная части — ключом deduction_pp (доли
    #   RWA). Одна траектория на все миры; числа пишет команда перевывода (шаг deductions листа вывода). Слагаемые:
    #     (1) рост вычетов из капитала сверх роста с RWA: 0,1 п.п. за квартал с 3К2026 по 4К2028 накопленно (1,0 п.п.) [В: решение B7 —
    #         свидетельства 1,98 / 0,73 / 0,03…0,82 п.п. в год, середина 0,43] — запас того же состава, что вычет якоря: доля 0,6065 (узел фактов
    #         balance.fixed_share_of_deductible) — сумма в рублях (deduction_rub: доля × п.п. × RWA якоря 24 916,3), остальное — в п.п. RWA
    #         (deduction_pp); ось 0…0,8 п.п. в год — связкой; долю η ведёт и ось доли вычета якоря (решение ведущего № 4, п. 3.3: одно суждение);
    #         состав роста вычетов «целиком в рублях / целиком с RWA» — справочные варианты ded_growth_all_rub и ded_growth_all_rwa; природа
    #         роста вычетов на стороне баланса (решение ведущего № 5, п. 3.1; исправляет последнюю фразу решения № 4, п. 3.2): доля η —
    #         создание ОНА и гудвила, оплаченное деньгами, — и в пути постоянной части прочих активов (та же сумма в том же квартале, вес 0);
    #         доля 1 − η (НМА) — только на стороне капитала; справочные чтения — ded_growth_regulatory («регуляторный счёт», центр книги 0.4)
    #         и ded_growth_asset_all («весь рост — актив МСФО»);
    #     (2) СНЯТО (решение ведущего № 4, п. 3.1): половина денег выпуска по 87 ₽, которая стоимости не создаёт, в оценку не входит вовсе —
    #         выпуск записан притоком капитала equity.other_movements.2026Q4 (доля денег × объём), а не вычетом из капитала норматива;
    #     (3) регуляторный вычет сценария: 0 / 0,3 / 0,6 п.п. RWA (mid / strict) С 2029 ГОДА [В: решение B6] — в п.п. (deduction_pp);
    #     (4) ВЫСВОБОЖДЕНИЕ отложенного налогового актива — сумма в рублях (deduction_rub): −0,085 п.п. × RWA якоря (21,2 млрд ₽) за год с 2029
    #         года, накопленно до −169,4 млрд ₽ к 2036 году; значение года действует с его 1-го квартала [В: решение ведущего № 2, п. 4.5 —
    #         середина между нулём и линейным использованием убытков к 2040 году по допущению банка (0,17 п.п. RWA в год)]. НА СТОРОНЕ БАЛАНСА —
    #         теми же рублями в том же квартале (решение ведущего № 4, п. 3.2; К2): путь постоянной части прочих активов
    #         volumes.other_assets_fixed_change, вес риска уходящей части 0 (capital.rwa.density.other_assets_fixed_change); лист вывода сверяет
    #         равенство сумм обеих сторон. Ось 0…−0,17 в полосу НЕ ВХОДИТ — цена справочными вариантами dta_release_none и dta_release_full (обе
    #         стороны).
    #   Ключи — самые короткие, которые воспроизводят ряд по кварталам правилами MODEL §0.4 (лист сверяет запись чтением ядра): кварталы
    #   2026–2028 годов (рост вычетов внутри года), годы 2029–2036 (год плоский); 2036 год — ключом года (квартальные ключи в году
    #   last_period ядро запрещает), LT — его значение. Ключ квартала якоря 2026Q2 = 0 записан явно. Прежняя запись «рубли / RWA модальной
    #   клетки + п.п.» (замороженная форма: остаток +0,27 ₽ на книге 0.3) снята.
    schedule:
