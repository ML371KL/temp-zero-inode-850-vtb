  lt_spread_floor: {corp_loans: -0.0184, mortgage: -0.025, consumer_loans: 0.015}
                                                               # пол эффективного LT-спреда кредитной книги к её опоре (ключевой) в стационаре мира [Р/В: лист calib-nii/r2; решение B4]:
