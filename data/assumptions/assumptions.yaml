                                                               #   r2/sheets/crisis_double_count.csv. Ось 0…−770 (2022 год в долях капитала обыкновенных акционеров)
    shock_year_offset: 1                                       # год шока = год якоря + 1 (2027): отменяется выплата, решаемая в этом году; взнос докапитализации в год
