# КНИГА 0.3 — РЕШЕНИЯ ВЕДУЩЕГО № 3 (notes/LEAD-DECISIONS-3.md; правила заданы до счёта третьего круга):
#   раздел 3 — рост портфеля: уровень окна в мире окна (volumes.loan_share_drift, funds_share_drift, share_drift_until; ось роста после 2028 года);
