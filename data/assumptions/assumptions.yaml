  kappa_reference_world: M                                     # A-C0b: мир, в котором стоят пути и уровни CoR режимов: окно 2023К1–2026К2 прошло при средней ключевой 15,5 %
                                                               #   (реальная экс-пост 8,35 п.п.) — условия мира «Рыночный как есть» [В: устав калибровки]. При κ = 0 мир-опора
                                                               #   на число не влияет; ключ нужен оси κ
