# ------------------------------------------------------------------ ДИВИДЕНДЫ — ПОЛИТИКА ДАННЫМИ (A-D*) — лист calib-capital/r2
# Годовая ветвь ядра, как у Сбербанка (решения ведущего A, B1): решение о дивиденде раз в год в квартал собрания; выплата —
# остаток над требованием в точках проверки при цели 50 % ВСЕЙ прибыли группы (за 2026 год — 25 %: решение № 2, п. 4.2);
# затем — взнос капитала (докапитализация, capital.recapitalization). Порядок «дивиденд, затем взнос» — наблюдаемое поведение банка
# (2025: выплачено 275,8 и привлечено 377) — решение № 2, п. 4.3. СТУПЕНЕЙ НЕТ (steps: []): ядро платит min(цель; запас).
# БАЗА: политика считает дивиденд от ВСЕЙ прибыли группы, слот ядра — прибыль акционеров: доля книги = доля политики /
# (1 − pnl.nci_share) — шаг payout листа вывода.
dividends:
  policy:                                                      # [Ф: P/DIV_policy_2016-01-29.pdf, пп. 3.1, 4.3: «как правило, не менее 25 % консолидированной чистой прибыли по МСФО»]
    name: "Положение о дивидендной политике Банка ВТБ (ПАО) (наблюдательный совет 29.01.2016, протокол № 2)"
    base: ifrs_ni_shareholders                                 # слот ядра — прибыль акционеров; доли умножены на 1 / (1 − 0.034)
    deduct_at1_after_tax: false                                # купон бессрочных из базы не вычитается [Ф: 125,5 = 25,0 % × 502,1]
    payout: {"2026": 0.2588, LT: 0.5176, LT_from: 2027}       # [Р] ВЫВЕДЕНО НА ЯДРЕ 14.10.2026 — цель выплаты по году прибыли ÷ (1 − pnl.nci_share): за 2026 год — 25 % [Ф/В: звонок 28.07.2026 и Интерфакс 01.07.2026 —
                                                               #   50 % за 2026 год «маловероятны»; «25 % — нижняя граница, 50 % — верхняя»], с прибыли 2027 года — цель 50 %
                                                               #   [В: устав — цель 50 % при достаточном капитале]; фактическая выплата — остаток над требованием (shortfall_rule).
                                                               #   ВНИМАНИЕ (красный флаг отчёта): решение о дивиденде видит только точки проверки 3-го и 4-го кварталов года
                                                               #   выплаты и ступень 01.04 следующего года не видит — её видит взнос. При цели 50 % за 2026 год модель заплатила бы
                                                               #   на 118 млрд ₽ больше и столько же привлекла (вариант payout_2026_target_50)
    metric: n20_0
    threshold: 0.0                                             # числового порога норматива в политике нет: требование = пол сценария + запас менеджмента
    steps: []                                                  # ступеней нет — форма книги Сбербанка (обоснование — в шапке)
    shortfall_rule: residual_above_requirement
    divisor: issued                                            # [Ф: 12 927,766 млн размещённых акций]
    dps_rounding: half_up_kopeck                               # при history_test: none не читается
    forecast_rounding: none
    history_test: none                                         # формулы «до копейки» у политики нет: выплаты за 2016–2025 годы 95, 60, 15, 10, 43, 0, 0, 0, 50, 25 % прибыли
  payout_deviation: {LT: 0.0}                                  # [В: Цель выплаты — путь книги (25 % за 2026 год, далее 50 %); отклонение — ноль]
  excess:                                                      # выплата избытка над требованием сверх цели
    from_profit_year: 2030                                     # [В: первый год после цикла стратегии 2027–2029, на который менеджмент назвал потолок 50 % («50 % — максимум,
                                                               #   который можно ожидать от нас», 27.05.2026); график надбавок кончается в 2028 году, в сценариях mid и strict
                                                               #   требование растёт до 2030–2031 годов]
    epsilon: 0.5                                               # [В: Наблюдения нет: избыток над требованием банк не копил; середина отрезка 0…1]
                                                               #   избыток над «пол + 0,5 п.п.» банк не накапливал (наибольший 0,67 п.п. на 30.06.2025, перед дивидендом) и сверх 50 %
                                                               #   прибыли с 2018 года не платил: диапазон свидетельств — весь отрезок 0…1, центр — середина
    ramp_years: 3                                              # форма семейства (ввод за три года); у ВТБ накопленного запаса к 2030 году нет — на центр почти не влияет
  crisis: {skip_in_shock_year: true, catch_up: false}          # год шока — 0 [Ф: за 2021–2023 годы дивиденда не было]; догоняющей выплаты нет [Ф: после урезанного 2019 года
                                                               #   (10 %) — 43 %, после паузы 2021–2023 — 50 % и 25 %: выше цели банк не платил ни разу; r2/sheets/dividend_history_rules.csv]
  buyback: {enabled: false}
  calendar:                                                    # годовой календарь, кварталы года Y + 1
    frequency: annual
    agm_quarter: 2                                             # собрание — 2-й квартал [Ф: 30.06.2025 и 30.06.2026]; МСФО вычитает дивиденд из капитала в квартал собрания
    reg_deduction_quarter: 3                                   # вычет из капитала норматива — август [Ф: Н20.1 группы 7,2 % на 01.08.2026 → 6,7 % на 01.09.2026; 2025: 7,1 → 6,1 %]
    payment_quarter: 3                                         # выплата — до 04.08.2026 номинальным держателям [Ф]
    checkpoints: [3, 4]                                        # точки проверки запаса — концы 3-го и 4-го кварталов года выплаты (после вычета дивиденда из норматива);
                                                               #   ядро берёт точки только внутри года Y + 1 — ступень 1-го квартала года Y + 2 видит взнос (окно capital.recapitalization.lookahead_quarters: 3)

bridge:
  declared_dividends: register                                 # объявленный дивиденд до последнего дня покупки — из реестра; на 13.10.2026 реестр пуст: дивиденд за 2025 год
                                                               #   (9,71 ₽, реестр 20.07.2026) отсечён и выплачен, в капитале якоря вычтен [Ф: МСФО 6М2026, прим. 24]
  governance_applies: false                                    # мост не несёт дисконта за управление (MODEL §8.2)

# ------------------------------------------------------------------ ОЦЕНКА (A-V*) — каркас сборщика; суждения — устав калибровки, раздел 3, и решения ведущего
valuation:
  shares_basis: issued                                         # делитель — размещённые акции 12 927,766 млн [Ф: МСФО 6М2026, прим. 22, с. 31; лист calib-capital]
                                                               #   79,784 млн акций у компаний группы (0,62 %) остаются в делителе; дивиденд уходит из капитала по акциям в обращении
  share_count_adj: 0.288962                                    # выпуск по 87 ₽: 325 / 87 = 3 735,632 млн акций к 12 927,766 млн [В: Зарегистрирован выпуск до 6,29 млрд акций по 87 ₽; ориентир банка 300–400 млрд ₽]
                                                               #   устав: 325 — середина нижней половины ориентира; ось-связка объёма — приток капитала (доля денег × объём, equity.other_movements.2026Q4)
                                                               #   и делитель (объём / 87); ключей вычета у выпуска нет (решение ведущего № 4, п. 3.1)
  cell_floor: 0.0                                              # ограниченная ответственность (MODEL §8.2): в смесь слоя клетка входит как max(V, 0), млрд ₽ [В: решения ведущего A и E5].
                                                               #   Массу клеток на полу и сдвиг заголовка от пола печатают сообщения гейтов хвоста. Цена пола справочным вариантом не выражается
                                                               #   (варианту нужна книга БЕЗ ключа): считается пробой сетки — stage1/probe/REPORT-merge-v2.md
  beta_e: 0.97                                                 # A-V1: β капитала, окно 3 года — правило семейства [Р: Недельная доходность акции против индекса Мосбиржи полной доходности, 3 года]
                                                               #   устав: 0,97 (3 года); 0,945 (2 года); 1,22 (5 лет); ось 0,75–1,20
  erp: 0.0557                                                  # A-V2: конвенция семейства, не суждение панели [Ф: Премия за риск по Дамодарану на январь 2026 года; решение владельца 30.09.2026]
                                                               #   ось 4,9–6,2 %
  roll_along_forwards: true                                    # A-V10: перекат по форвардам (MODEL §0.5)
  governance:                                                  # A-V7: дисконт за управление — 0, каналы пусты [В: устав §3]: распределения по указанию акционера
    discount: 0.0                                              #   уже стоят строкой equity.other_movements (−25 в год); дисконт сверх этой строки — ноль
    components: []
  terminal:                                                    # одностороннее угасание (ключа fade_mode нет); вид угасания — справочный вариант fade_symmetric
    real_growth: 0.015                                         # A-V3b: g_real [В: Суждение книги; потенциальный рост экономики по Банку России — 1,5–2,5 %]
                                                               #   ось 0,5–2,5 %
    fade: 0.5                                                  # A-V4: угасание избыточной доходности — множитель к max(ROE_T − k_T, 0) [В: Как в книге Т: избыточная доходность терминала угасает наполовину]
                                                               #   у ВТБ доходность ниже стоимости капитала в большинстве клеток — одностороннее угасание тогда не действует (развилка:
                                                               #   вариант fade_symmetric)
