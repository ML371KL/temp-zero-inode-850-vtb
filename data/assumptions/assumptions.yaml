#     («пары к переходным частям наследуются», форма книги 0.6).
# КНИГА 0.7 — КЛЮЧИ ВОСЬМОГО ПРОХОДА ЯДРА (решения ведущего № 7, пп. 2.1–2.3 и № 8, п. 1.2; notes/LEAD-DECISIONS-8.md; правила заданы до
