# ------------------------------------------------------------------ КОРИДОРЫ ГЕЙТОВ И ДОПУСКИ ИНВАРИАНТОВ (MODEL §14) — каркас сборщика.
# Гейты машины роста по капиталу (growth_cut, step_dividend) сняты: в годовой форме без ограничения роста им нечего читать
# (лист calib-capital/r2). КОРИДОРЫ ГЕЙТОВ — СТОРОЖА (решение ведущего № 2, п. 7.7): их ставит сборщик РУКОЙ от окон устава и
# листов, с причиной в комментарии; лист вывода (шаг corridors) считает правило «по счёту ядра» на сетке центральной книги,
# команда перевывода СВЕРЯЕТ книгу с ним, но НЕ ПИШЕТ. Пишется только поле окна фактов checks.window_backtest.loans_share.
checks:
  ddm_ri_tol: 0.001                                            # инвариант ddm_equals_ri: |V_DDM − V_RI| / V_RI в клетке
  transmission_tol: 1.0e-9                                     # инвариант transmission_solved
  exdate_jump_tol: 0.01                                        # инвариант exdate_jump
  grid_variance: sequential                                    # правило разброса цены по осям сетки (MODEL §3.4, прил. A № 22) — последовательное [В: решение ведущего № 4,
                                                               #   дополнение 6.1: у книги ВТБ — в центре; без него выпуск с «послаблением» отказывает]. Суждение, не сторож
  pb_by_world: {N: [0.35, 1.15], H: [0.1, 0.85], M: [0.05, 0.55]}    # СТОРОЖ, поставлен рукой 14.10.2026 по счёту ядра после перевывода книги 0.6 (решения № 6)
                                                               #   на ядре шестого и седьмого проходов: клетки N 0,36…1,09; H 0,11…0,81; M 0,00…0,52 —
                                                               #   правило листа даёт N [0.35, 1.1] (верх клеток мира N опустился ниже 1,10 — клетки мира N дешевле: слой мира N на
                                                               #   ключе доли T2 своей клетки −0,86 ₽ на книге 0.5, решение № 6, п. 2.1; прочие 2028–2029 без встречной σ0, п. 2.2); H и M —
                                                               #   без изменений. Прежние слова — книги 0.4 на ядре пятого прохода:
                                                               #   (решение № 2, п. 7.7): стоимость клетки в цене (с полом клетки) к её капиталу, размах клеток положительной вероятности по мирам —
                                                               #   N 0,39…1,11; H 0,12…0,83; M 0,00…0,52, наружу до 0,05; низ не ниже 0,05 — клетку у нуля и на полу гейт называет, а не прячет.
                                                               #   Причина сдвига от сторожа книги 0.4 на ядре третьего прохода (N 0,3…1,15; H 0,05…0,8; M 0,05…0,45): ключи пятого прохода ядра —
                                                               #   постоянные в рублях части стоят в рублях и за концом сетки (λ_F = 0, решение № 4, п. 3.8), высвобождение ОНА на балансе (п. 3.2):
                                                               #   стоимость клеток выше, клетки у нуля ушли от нуля (кроме мира M в кризисе). Сторож книги 0.4 на ядре третьего прохода — за
                                                               #   выпуск по 87 ₽ одним местом, «послабление» — смесь сценариев, ближний ключ прочих доходов (решение № 4, пп. 3.1, 3.4, 3.6).
                                                               #   Прежняя причина (книга 0.3): доля вычета якоря, постоянная в рублях, решение о взносе в 4-м квартале и «послабление» в кризисе. Рыночный P/B — 0,36 (печать команды перевывода)
  roe_range: [-0.15, 0.30]                                     # ROE года: прибыль акционеров к капиталу обыкновенных акционеров МСФО [В: история ВТБ: до 37 % в квартале 2023 года,
                                                               #   убыток 2022 года; год шока кризиса с разовым убытком 300 — около −10 %]
  cor_range: [0.002, 0.04]                                     # CoR года, базис движка: пути режимов 0,6–3,0 % упр. минус мост [В]
  nim_range: [0.015, 0.04]                                     # ЧПМ квартала, определение банка (через мост, по фактам нуль): кварталы 2023–2026 годов 0,7–3,5 %; ближние — 2,5–2,8 % [В]
  cir_range: [0.30, 0.62]                                      # C/I года, базис движка: годы 2023–2025 — 36–47 %, кварталы до 58 % [В]
  roe_k_spread: {range: [-0.06, 0.02], max_world_gap: 0.04}    # СТОРОЖ, поставлен рукой 14.10.2026 по ПРАВИЛУ ЛИСТА НА МЕРЕ ГЕЙТА (решение ведущего № 6,
                                                               #   п. 2.4; шаг corridors): разрыв средних «ROE терминала − k» по мирам — та же формула, что читает гейт roe_k_homogeneity
                                                               #   (вероятности аналитического слоя по клеткам, которые судит гейт): книга 0.6 — 3,75 п.п. (N 0,32 / H −1,74 / M −3,43;
                                                               #   простым средним клеток — 3,72) — вверх до 0,01 даёт 0.04; клетки −5,1…1,6 п.п. — [-0.06, 0.02]. Число пишет правило;
                                                               #   рукой — только перенос. Прежние слова — книги 0.5 (решения № 5):
                                                               #   клетки -5.3…+1.7 п.п.; разрыв средних по мирам 3.99 п.п. (N +0.2; H -1.9; M -3.8) — вверх до 0,01 даёт 0.04
                                                               #   (книга 0.4: разрыв чуть выше 4,0 п.п. — 0,05). ВНИМАНИЕ: мера гейта roe_k_homogeneity (по мирам N +0,39 / H −1,75 / M −3,63)
                                                               #   даёт разрыв 4,02 п.п. — при стороже 0,04 гейт срабатывает; мера правила листа (среднее клеток положительной вероятности) — 3,99.
                                                               #   Сторож — по правилу листа; расхождение мер — флаг ведущему (лист corridors на мере гейта — медленный круг). Прежние слова — книги 0.4: поставлен рукой 14.10.2026 по счёту ядра после перевывода
                                                               #   книги 0.4 на ядре пятого прохода:
                                                               #   ROE'_T − k_T клеток центральной книги −5,3…+1,7 п.п., наружу до 0,01; разрыв средних по мирам 4,0 п.п. (N +0,3; H −1,9; M −3,8), вверх
                                                               #   до 0,01. НОВАЯ МЕРА (MODEL §7, пятый проход): при λ_F < 1 гейт читает ROE терминала БИЗНЕСА — без стоящей вне бизнеса доли постоянных
                                                               #   частей (капитал бизнеса B = BV* − (1 − λ_F) F_K, доход без дохода блока); той же мерой — гейты k_gt_g, roe_gt_g и флаг roe_below_k.
                                                               #   Бездоходный капитал под постоянными частями из знаменателя ушёл — ROE бизнеса выше (книга 0.3: −7,4…+0,3 п.п.; разрыв 4,6).
                                                               #   Доходность терминала ниже стоимости капитала в большинстве клеток: это свойство калибровки, а не допуск
  terminal_share: [0.2, 0.55]                                   # СТОРОЖ, поставлен рукой 14.10.2026 по счёту ядра после перевывода книги 0.7 с ключами восьмого прохода
                                                               #   (решения № 8, п. 1.2): клетки 0,2393…0,5186 (33 из 36 с P/B не ниже 0,05; у нуля — M/crisis/mid, M/crisis/strict, M/crisis/relief)
                                                               #   — правило листа даёт [0,2; 0,55]: низ клеток ушёл ниже 0,25 (0,2604 → 0,2393, клетка
                                                               #   M/downturn/schedule; ниже 0,25 — клетки мира H в кризисе и мира M в спаде) — ключи восьмого прохода вместе:
                                                               #   по одному выключенному низ — 0,2451 (без прочих движений за T: OM_ann / k_T уменьшает PV терминала),
                                                               #   0,2501 (без доли AT1), 0,2437 (без надбавки T2); верх клеток 0,5483 → 0,5186.
                                                               #   Прежние слова — книги 0.5 (решения № 5): клетки 0.2600…0.5459
                                                               #   (33 из 36 с P/B не ниже 0,05; у нуля — M/crisis/mid, M/crisis/strict, M/crisis/relief): верх клеток ушёл ниже 0,55 — правило листа даёт [0.25; 0.55]
                                                               #   (книга 0.4: 0,26…0,55 → [0,25; 0,6]: верх клеток был над 0,55 на четвёртом знаке). Прежние слова — книги 0.4:
                                                               #   поставлен рукой 14.10.2026 по счёту ядра после перевывода книги 0.4 на ядре пятого прохода: PV терминала
                                                               #   (TV_DDM − DC_T, MODEL §7) к норме клетки у клеток положительной вероятности с P/B не ниже 0,05 (33 из 36) — 0,26…0,55, наружу до
                                                               #   0,05. Причина сдвига от сторожа на ядре третьего прохода [0,15; 0,55] (32 из 36, 0,20…0,53): при λ_F = 0 постоянные в рублях части
                                                               #   стоят вне бизнеса — TV_DDM = X_T + P_T выше в клетках с постоянными частями, клетки у нуля ушли от нуля (у нуля — 3: M/crisis/
                                                               #   mid, strict, relief). Книга 0.3: 34 из 36, 0,15…0,52. Причина сдвига к прежнему
                                                               #   сторожу [0,4; 3,15] — мера ядра второго прохода: норма клетки max(|V|, BV_v − C_v) (MODEL §6.4, §14.2) — у клетки со стоимостью ниже
                                                               #   капитала доля считается к капиталу на дату оценки, а не к её стоимости (прежняя мера у ВТБ давала доли выше единицы). Коридор семейства
                                                               #   0,15–0,65 задан в прежней мере и с новой не сравнивается. Клетки на полу (2: M/crisis/mid, M/crisis/strict) гейт называет
  real_rate: [0.02, 0.13]                                      # реальная ставка мира в терминале [В: как в моделях семейства]
  bridge_drift_pp: {cor: 0.004, nim: 0.0014}                   # дрейф моста упр. ↔ движок, доли: ≈2,5σ [Р: с.о. разности «движок − банк» за шесть кварталов 2025К1–2026К2:
