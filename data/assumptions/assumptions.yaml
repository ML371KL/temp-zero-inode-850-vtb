joint:
  world_prob: {N: 0.35, H: 0.45, M: 0.20}                # A-P1: слой «свой макро-взгляд» [Ф: общая запись сценариев ставок семейства моделей — magnit-850oa book-1.6]; не трогать
  world_prob_market_implied: {N: 0.10, H: 0.25, M: 0.65} # A-P1m: слой «вменённые рынком» [Ф: запись magnit-850oa book-1.6]; не трогать
  macro_neutral_world: M                                 # A-P1n: слой «рыночные ставки как есть» [Ф: запись семейства]
  own_macro_confidence: 0.5                              # A-P1c: λ, доля [Ф: запись семейства]
  regime_prob: {soft: 0.15, norm: 0.40, downturn: 0.30, crisis: 0.15}   # A-P2b: одна конвенция во всех мирах и слоях [Р/В: Частота лет спада у ВТБ 0,18–0,41 по границе классов, середина 0,30]
                                                         #   РЕШЕНИЕ B5. Частоты лет 2010–2026 по стоимости риска ВТБ зависят от границы «норма | спад»: при 1,45 % —
                                                         #   0,18 / 0,29 / 0,41 / 0,12; при 1,65 % (годы 2013, 2016, 2017, 2018 со стоимостью риска 1,5–1,6 % — в
                                                         #   «норме») — 0,18 / 0,53 / 0,18 / 0,12. Кризис — общая с книгой Сбера 0,15, остальное пропорционально:
                                                         #   0,170 / 0,283 / 0,397 и 0,170 / 0,510 / 0,170; середина двух границ 0,170 / 0,397 / 0,283 / 0,150 →
                                                         #   шагом 0,05: 0,15 / 0,40 / 0,30 / 0,15 — таблица семейства (книги Сбера и Т). В круге 1 стояло
                                                         #   0,15 / 0,30 / 0,40 / 0,15 (одна граница 1,45 %). Модальный режим — «нормализация».
                                                         #   Оси: вероятность кризиса 10–25 % (остальные — пропорционально); граница классов — от
                                                         #   0,15 / 0,30 / 0,40 / 0,15 (граница 1,45 %) до 0,15 / 0,52 / 0,18 / 0,15 (граница 1,65 %)
  reg_prob_given_regime:                                 # A-K1b: P(сценарий капитала | режим) [В: Середина вероятностей книг Сбера и Т: 0,30 / 0,45 / 0,25] (устав §3)
                                                         #   в кризисе 0 / 0,25 / 0,05 и «послабление» 0,70 [В] (лист calib-capital). Ось вероятностей ±5 п.п. массы (строки soft, norm, downturn).
                                                         #   СЦЕНАРИЙ «ПОСЛАБЛЕНИЕ» в кризисе — В ЦЕНТРЕ [В: решения ведущего № 2, п. 4.1 и № 3, п. 5.5]: надбавки обнуляются в год
                                                         #   шока и возвращаются за пять лет; вероятность 0,70 в строке кризиса — на месте «по графику» (масса переносится), в
                                                         #   остальных режимах — 0 (клетки нулевой вероятности: сетка 48 клеток, число клеток — произведение порядков, MODEL §3.4).
                                                         #   Цена суждения — справочный вариант crisis_no_relief («послабления нет»: кризис 0,70 / 0,25 / 0,05 / 0)
    soft:     {schedule: 0.30, mid: 0.45, strict: 0.25, relief: 0.0}
    norm:     {schedule: 0.30, mid: 0.45, strict: 0.25, relief: 0.0}
    downturn: {schedule: 0.30, mid: 0.45, strict: 0.25, relief: 0.0}
    crisis:   {schedule: 0.0, mid: 0.25, strict: 0.05, relief: 0.70}
  regime_update:                                         # A-P2u: квартальные наблюдения CoR и ЧПМ (MODEL §12) — БЕЗ ИЗМЕНЕНИЙ к кругу 1
    observables:
      cor: {sigma_pp: 0.0045, rho_q: 0.15}               # σ [Р: одиннадцать срезов истории 0,33–0,57 п.п., середина 0,45]; ρ [Р/В: срезы −0,01…+0,30, середина 0,15].
                                                         #   От вероятностей режимов не зависят: ни один срез их не использует. Два среза «уровень класса года»
                                                         #   зависят от границы классов: при 1,65 % — σ 0,51 и 0,47, ρ 0,17 и 0,19 (при 1,45 % — 0,42 и 0,37; 0,04 и
                                                         #   −0,01) — внутри прежних диапазонов, центры не сдвигаются. В БАЗИСЕ ДВИЖКА σ 0,51–0,66 п.п. — при
                                                         #   наблюдениях basis: engine ставить 0,0058
      nim: {sigma_pp: 0.003, rho_q: 0.4}                 # σ [Р: 0,13–0,19 п.п. в спокойные 2016–2021 годы … 0,37–0,45 п.п. — остаток регрессии на ключевую, середина
                                                         #   0,29]; ρ [Р/В: 0,0–0,2 … 0,5–0,8, середина 0,4]. С новым знаменателем маржи движка (решение B2) мост
                                                         #   «движок − банк» около нуля — базис наблюдений по-прежнему банка
    max_shift_pp: 0.05                                   # предел сдвига вероятности режима за одно квартальное наблюдение [В: как в книгах Сбера и Т]
    window_obs: 4                                        # фильтр читает четыре последних квартальных наблюдения [В: конвенция семейства]
    floor_share: 0.33                                    # пол вероятности режима — не ниже 0,33 × базовой: мягкая посадка и кризис — 4,95 %, нормализация — 13,2 %,
                                                         #   спад — 9,9 % [В: конвенция семейства]
    shrink_by_se: true                                   # у нау-каста (se > 0) — Калман со сжатием
    observations: []                                     # [{period: "2026Q3", cor: 0.009, nim: 0.027, se_cor: 0.0, se_nim: 0.0, basis: mgmt}] — факт МСФО 3К2026 (30.10.2026).
                                                         #   Во 2-м полугодии 2026 года пути режимов расходятся на 0,1 п.п. (0,2σ) — отчёт за 3-й квартал о режиме
                                                         #   почти ничего не скажет; различать режимы начнут кварталы 2027 года (норма и спад: 0,5–0,8 п.п.)

