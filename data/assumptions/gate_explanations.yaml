# Письменные объяснения сработавших гейтов правдоподобия — книга Банка ВТБ (MODEL §14.2; читает model/checks.py).
#
# Правило семейства: гейт — не ошибка, а место, где модель расходится с историей, гайденсом или рынком; расходиться
# можно, не замечать — нельзя. Сборку выпуска роняет (код 1) только сработавший гейт без действующего объяснения: нет
# записи здесь, истёк срок (valid_until действует включительно) или масса вне коридора 0,4 × lo − 0,02 … 1,5 × hi + 0,02.
# Объяснение, которому до срока меньше 30 дней, — плашка выпуска «объяснение истекает», не тревога и не отказ
# (MODEL §14.3).
#
# Масса — суммарная вероятность клеток слоя «Свой макро-взгляд», где условие нарушено (у гейтов уровня выпуска — 1; у
# гейта знака стресса — вероятность нарушивших клеток под вероятностями точки, поэтому рядом с массами остальных гейтов
# её не сравнивают; у гейта стоимости средств клиентов — вес миров слоя «Свой макро-взгляд», где порог превышен).
# Имена гейтов — MODEL §14.2: pb_by_world, roe_range, cor_range, nim_range, cir_range, roe_k_homogeneity, guidance_gap,
# capital_gap, k_gt_g, roe_gt_g, terminal_share, real_rate, bridge_drift, m_crisis_vs_cbr, manual_input_overdue,
# nim_path_joint, transmission_pairs, lt_spread_floor, off_band_shift и гейты второй формы банка: growth_cut,
# step_dividend, cir_lt, wholesale_share, payout_cap, volume_sign, stress_sign, nim_stationary, window_backtest,
# funds_cost_to_key. Коридоры гейтов — в книге (блок checks шаблона; потолок выплаты — dividends.policy.cap), не здесь.
#
# ТЕКСТ ОБЪЯСНЕНИЯ ПЕЧАТАЕТ ВИТРИНА — он пишется словами для владельца (PAYLOAD §0.2): без имён ключей и полей, без
# меток класса допущения в скобках, без ссылок на листы и файлы, без рабочих пометок; доли — в процентах, разности долей
# — в п.п., даты — с годом. Записи — только у сработавших гейтов: запись тихого гейта снимается. В объяснении — что гейт
# мерит, в каких клетках и на сколько он сработал (по счёту сетки книги, а не по догадке) и почему это свойство книги.
#
# Формат записи:
#
#   capital_gap:
#     explanation: >-
#       Что нарушено, в каких клетках и почему это правильно (или почему книга с этим согласна) — текстом для владельца.
#     expected_mass: 0.045                 # ожидаемая масса гейта; либо коридор дрейфующей массы:
#     # expected_mass_range: [0.04, 0.06]  # (масса законно дрейфует с датой оценки — перекат, доля остатка квартала)
#     valid_until: 2027-02-26              # включительно; объяснение книги с якорем 3К2026 живёт до перезаякоривания;
#                                          #   у guidance_gap — не дольше отчёта МСФО за первый прогнозный квартал книги
#
# Миры ставок и слои называются в объяснении их именами в книге; имя режима «нормализация» с именем мира не совпадает.
# О сроке действия текст объяснения не говорит: строку «Объяснение действует по …» витрина печатает сама по полю
# valid_until. Срок записи — до перезаякоривания книги на следующую отчётность МСФО (событие календаря фактов).
#
# КНИГА 1.0 — ОБЪЯСНЕНИЯ ДЕЙСТВУЮТ ДО ПЕРЕЗАЯКОРИВАНИЯ (на отчётность МСФО за 2026 год: событие календаря фактов ifrs-2026Q4,
# окно 24–26.02.2027; срок записей — поздняя граница окна). Записи — по счёту сетки книги 1.0 (якорь 3К2026, факты на 30.09.2026,
# дата оценки 30.10.2026, миры ставок 1.7; таблицы книги, 2000 прогонов): сработали 7 гейтов из 25 — pb_by_world 0,048,
# roe_range 0,021, nim_path_joint 0,21 (новый: восьмой прогнозный квартал — 3К2028), terminal_share 0,03, cir_lt 1, volume_sign 1,
# stress_sign 0,64 (под вероятностями точки). Не сработали guidance_gap (путь 2026 года внутри прогноза банка: центр прочих
# доходов 4К2026 — по прогнозу 600) и roe_k_homogeneity (разрыв миров 4,22 п.п. при стороже 0,05 — правило листа) — их записей нет.
# Сторожа pb_by_world, terminal_share, roe_k_spread — правило листа на книге 1.0 (решение ведущего 04.11.2026). guidance_gap, если
# сработает на следующей книге, — срок не дальше отчёта за 4К2026.

pb_by_world:
  explanation: >-
    Отношение стоимости к капиталу выходит за коридор мира в пяти клетках (вместе 4,8 % слоя «Свой макро-взгляд»). В мире
    «Рыночный как есть» (коридор от 0,05 до 0,45) три клетки режима «Кризис» — сценарии «Средняя группа СЗКО», «Жёсткий» и
    «Послабление в кризис» — стоят на нуле: их стоимость отрицательна (−513, −644 и −141 млрд ₽ при капитале 2 682 млрд ₽), а
    акционер отвечает только своим вкладом, поэтому такая клетка входит в оценку нулём; клетка режима «Корпоративный спад» со
    сценарием «Жёсткий» стоит 95 млрд ₽ — 0,035 капитала. В мире «Высокие ставки надолго» (коридор от 0,05 до 0,75) — клетка
    режима «Кризис» со сценарием «Жёсткий»: 117 млрд ₽, 0,044 капитала. К высоким ставкам этих миров кризис добавляет год шока
    2027 — разовый убыток 300 млрд ₽ и стоимость риска 3 % за год, а спад — годы низкой доходности при самом строгом требовании
    к капиталу. Это свойство книги: кризис в мире высоких ставок стоит ВТБ почти всей стоимости, а не ошибка счёта.
  expected_mass: 0.048
  valid_until: 2027-02-26

roe_range:
  explanation: >-
    Доходность капитала года выходит за коридор от −15 до +30 % в одной клетке — мир «Рыночный как есть», режим «Кризис»,
    сценарий «Послабление в кризис» (2,1 % слоя «Свой макро-взгляд»): в 2027 году, году шока, она −15,4 % при убытке
    акционеров 399 млрд ₽ (разовый убыток 300 млрд ₽ и стоимость риска 3 % за год). В сценариях «Средняя группа СЗКО» и
    «Жёсткий» той же клетки убыток 366 млрд ₽ и доходность −11,9 % — внутри коридора. Глубина убытка — суждение книги о
    кризисе (некредитные потери ВТБ в 2022 году — 26 % капитала); коридор сторожит обычные годы, и год шока в мире высоких
    ставок его пробивает.
  expected_mass: 0.021
  valid_until: 2027-02-26

nim_path_joint:
  explanation: >-
    Маржа первых восьми прогнозных кварталов не должна превышать большее из маржи якоря (2,67 % по счёту модели; отчётная
    маржа 3-го квартала 2026 года — 2,7 %) и долгосрочной маржи своего мира больше чем на 0,3 п.п. Гейт срабатывает в восьми
    клетках мира «Нормализация ставок» (21 % слоя «Свой макро-взгляд»: режимы «Мягкая посадка» и «Нормализация» в сценариях
    «По графику», «Средняя группа СЗКО» и «Жёсткий», режим «Кризис» в сценариях «Средняя группа СЗКО» и «Жёсткий») и в одном
    квартале — 3-м квартале 2028 года: 3,26–3,29 % при пороге 3,22 % (долгосрочная маржа мира 2,92 % и 0,3 п.п.), превышение
    0,04–0,07 п.п. В этом мире ключевая ставка снижается с 14,05 % до 9,75 % к 3-му кварталу 2028 года: средства клиентов
    дешевеют быстрее кредитов, и маржа поднимается; кроме того, путь идёт на растущем капитале и других бесплатных пассивах, и
    маржа пути выше долгосрочного уровня, посчитанного на составе баланса 30.09.2026, около 0,3 п.п. и в следующие годы.
    Превышение мало и приходится на один квартал на спаде ставки — это свойство пути снижения ставки, а не ошибка ближнего пути.
  expected_mass: 0.21
  valid_until: 2027-02-26

terminal_share:
  explanation: >-
    Доля терминала в стоимости ниже коридора 20–50 % в трёх клетках мира «Рыночный как есть» с режимом «Кризис» (сценарии
    «Средняя группа СЗКО», «Жёсткий» и «Послабление в кризис»; 3 % слоя «Свой макро-взгляд»): 16,1–16,4 %. Стоимость этих
    клеток отрицательна (от −644 до −141 млрд ₽ при капитале 2 682 млрд ₽), и у таких клеток доля терминала считается к
    капиталу, а не к стоимости: убыток года шока съедает явный участок, и терминал несёт около шестой части капитала. В
    остальных 33 клетках положительной вероятности доля — от 20,7 до 48,4 %, внутри коридора.
  expected_mass: 0.03
  valid_until: 2027-02-26

cir_lt:
  explanation: >-
    Расходы к доходам (определение банка) в слое «Рыночные ставки как есть» в среднем за 2033–2036 годы — 39,0 % при цели
    книги 42 % ± 2 п.п., на 1,0 п.п. ниже коридора (модальная клетка — 39,6 %). Цель поставлена на составе баланса якоря; на
    пути при высоких ставках мира «Рыночный как есть» растущий собственный капитал и текущие счета, за которые банк платит мало
    или не платит вовсе, приносят больше процентного дохода, и доходы растут быстрее расходов: без вклада капитала и других
    бесплатных пассивов отношение было бы 47,9 %. Расходы книги заданы суждением о росте, а не подгонкой под отношение,
    поэтому отношение ниже цели — свойство состава баланса в мире высоких ставок.
  expected_mass: 1.0
  valid_until: 2027-02-26

volume_sign:
  explanation: >-
    Если снять остановку кредита в кризисе и поправки роста кредитов по режимам, точка снижается на 2,05 ₽ (53,02 →
    50,97 ₽): цена мира «Нормализация ставок» — на 0,49 ₽, мира «Высокие ставки надолго» — на 2,21 ₽, мира «Рыночный как
    есть» — на 2,45 ₽. Условие гейта — лишний рост точку не снижает, и в мире «Рыночный как есть» не хуже, чем в мире «Высокие
    ставки надолго»; у ВТБ нарушено и то и другое. Причина — доходность капитала ниже его стоимости: на конце сетки в клетке
    режима «Нормализация» она 14,5 % при стоимости 14,3 % в мире «Нормализация ставок», 15,9 % против 18,0 % в мире «Высокие
    ставки надолго» и 18,0 % против 22,1 % в мире «Рыночный как есть». Новый кредит в годы кризиса и спада не окупает
    стоимость капитала и отнимает стоимость — тем больше, чем выше ставки мира.
  expected_mass: 1.0
  valid_until: 2027-02-26

stress_sign:
  explanation: >-
    Гейт проверяет две вещи. Разовый убыток кризиса больше на 60 млрд ₽ стоимость клеток не повышает ни в одной клетке:
    стоимость падает на 0,69–1,03 ₽ на рубль убытка после налога — эта часть выполнена. Срабатывает вторая: при более
    высоком требовании к капиталу прибыль последнего года сетки выше в 24 клетках (все три мира и все режимы, сценарии
    «Средняя группа СЗКО» и «Жёсткий»; 64 % под вероятностями точки и столько же в слое «Свой макро-взгляд»), больше всего —
    на 202,9 млрд ₽ в мире «Рыночный как есть» при режиме «Мягкая посадка» и сценарии «Жёсткий» против сценария «По графику».
    Так устроена книга ВТБ: дивиденд — остаток над требованием, и чем выше требование, тем больше капитала банк оставляет у
    себя; оставленный капитал приносит процентный доход, и прибыль последнего года выше — следствие правила выплаты, а не
    ошибка знака.
  expected_mass: 0.64
  valid_until: 2027-02-26
