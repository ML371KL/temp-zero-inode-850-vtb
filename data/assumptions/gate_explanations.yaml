# Письменные объяснения сработавших гейтов правдоподобия — книга Банка ВТБ (MODEL §14.2; читает model/checks.py).
#
# Правило семейства: гейт — не ошибка, а место, где модель расходится с историей, гайденсом или рынком; расходиться
# можно, не замечать — нельзя. Сборку выпуска роняет (код 1) только сработавший гейт без действующего объяснения: нет
# записи здесь, истёк срок (valid_until действует включительно) или масса вне коридора 0,4 × lo − 0,02 … 1,5 × hi + 0,02.
# Объяснение, которому до срока меньше 30 дней, — плашка выпуска «объяснение истекает», не тревога и не отказ
# (MODEL §14.3).
#
# Масса — суммарная вероятность клеток слоя «Свой макро-взгляд», где условие нарушено (у гейтов уровня выпуска — 1; у
# гейта знака стресса — вероятность нарушивших клеток под вероятностями точки, поэтому рядом с массами остальных гейтов
# её не сравнивают; у гейта стоимости средств клиентов — вес миров слоя «Свой макро-взгляд», где порог превышен).
# Имена гейтов — MODEL §14.2: pb_by_world, roe_range, cor_range, nim_range, cir_range, roe_k_homogeneity, guidance_gap,
# capital_gap, k_gt_g, roe_gt_g, terminal_share, real_rate, bridge_drift, m_crisis_vs_cbr, manual_input_overdue,
# nim_path_joint, transmission_pairs, lt_spread_floor, off_band_shift и гейты второй формы банка: growth_cut,
# step_dividend, cir_lt, wholesale_share, payout_cap, volume_sign, stress_sign, nim_stationary, window_backtest,
# funds_cost_to_key. Коридоры гейтов — в книге (блок checks шаблона; потолок выплаты — dividends.policy.cap), не здесь.
#
# ТЕКСТ ОБЪЯСНЕНИЯ ПЕЧАТАЕТ ВИТРИНА — он пишется словами для владельца (PAYLOAD §0.2): без имён ключей и полей, без
# меток класса допущения в скобках, без ссылок на листы и файлы, без рабочих пометок; доли — в процентах, разности долей
# — в п.п., даты — с годом. Записи — только у сработавших гейтов: запись тихого гейта снимается. В объяснении — что гейт
# мерит, в каких клетках и на сколько он сработал (по счёту сетки книги, а не по догадке) и почему это свойство книги.
#
# Формат записи:
#
#   capital_gap:
#     explanation: >-
#       Что нарушено, в каких клетках и почему это правильно (или почему книга с этим согласна) — текстом для владельца.
#     expected_mass: 0.045                 # ожидаемая масса гейта; либо коридор дрейфующей массы:
#     # expected_mass_range: [0.04, 0.06]  # (масса законно дрейфует с датой оценки — перекат, доля остатка квартала)
#     valid_until: 2026-11-30              # включительно; объяснение книги с якорем 2К2026 живёт до перезаякоривания;
#                                          #   у guidance_gap — не дольше отчёта МСФО за первый прогнозный квартал книги
#
# Миры ставок и слои называются в объяснении их именами в книге; имя режима «нормализация» с именем мира не совпадает.
# О сроке действия текст объяснения не говорит: строку «Объяснение действует по …» витрина печатает сама по полю
# valid_until. Срок записи — до перезаякоривания книги на следующую отчётность МСФО (событие календаря фактов).
#
# КНИГА 0.8 — ОБЪЯСНЕНИЯ ДЕЙСТВУЮТ ДО ПЕРЕЗАЯКОРИВАНИЯ (на отчётность МСФО за 3-й квартал 2026 года). Записи — по счёту
# сетки книги 0.8 (машинная книга дерева, факты на 30.06.2026, дата оценки 13.10.2026): сработало 7 гейтов из 25 —
# pb_by_world 0,03, roe_range 0,021, guidance_gap 1, terminal_share 0,03, cir_lt 1, volume_sign 1, stress_sign 0,64 (под
# вероятностями точки). Почему они срабатывают — разбор седьмого круга (stage1/probe/REPORT-numbers-r7.md,
# REPORT-merge-v7.md папки передачи) и счёт книги 0.8 тем же ядром: числа текстов ниже — книги 0.8.

pb_by_world:
  explanation: >-
    Отношение стоимости к капиталу выходит за коридор мира в трёх клетках мира «Рыночный как есть» с режимом «Кризис»
    (сценарии «Средняя группа СЗКО», «Жёсткий» и «Послабление в кризис»; вместе 3 % слоя «Свой макро-взгляд»): коридор
    мира — от 0,05 до 0,55, а клетки стоят на 0; 0 и 0,025. К высоким ставкам этого мира кризис добавляет год шока
    2027 — разовый убыток 300 млрд ₽ и стоимость риска 3 % за год (4 % в первом квартале). Стоимость первых двух клеток
    отрицательна (−292 и −419 млрд ₽ при капитале 2 551 млрд ₽), третьей — 63 млрд ₽; акционер отвечает только своим
    вкладом, поэтому отрицательная стоимость клетки входит в оценку нулём. Это свойство книги: кризис в мире высоких
    ставок стоит ВТБ почти всей стоимости, а не ошибка счёта.
  expected_mass: 0.03
  valid_until: 2026-11-30

roe_range:
  explanation: >-
    Доходность капитала года выходит за коридор от −15 до +30 % в одной клетке — мир «Рыночный как есть», режим
    «Кризис», сценарий «Послабление в кризис» (2,1 % слоя «Свой макро-взгляд»): в 2027 году, году шока, она −15,8 %
    при убытке акционеров 387 млрд ₽ (разовый убыток 300 млрд ₽ и стоимость риска 3 % за год). В сценариях «Средняя
    группа СЗКО» и «Жёсткий» той же клетки убыток 359 млрд ₽ и доходность −12,4 % — внутри коридора. Глубина убытка —
    суждение книги о кризисе (некредитные потери ВТБ в 2022 году — 26 % капитала); коридор сторожит обычные годы, и год
    шока в мире высоких ставок его пробивает.
  expected_mass: 0.021
  valid_until: 2026-11-30

guidance_gap:
  explanation: >-
    Путь 2026 года расходится с прогнозом банка на год в двух строках, во всех клетках. Прибыль: прогноз банка — около
    600 млрд ₽, рост на 14,5–24,5 % к 502 млрд ₽ 2025 года; путь модели — снижение на 6,1–10,9 %. Книга ведёт 2026 год
    по отчёту за первое полугодие (225 млрд ₽) и месячным результатам июля–августа; для прогноза банка второму
    полугодию нужно около 375 млрд ₽ — в 1,7 раза больше первого, а разовых доходов такого размера в отчётах нет.
    Расходы к доходам (определение банка): прогноз — менее 40 %, путь — 43,4–43,6 %; в книге расходы четвёртого
    квартала по сезонности банка в 1,4 раза выше среднего первых трёх кварталов.
  expected_mass: 1.0
  valid_until: 2026-10-30

terminal_share:
  explanation: >-
    Доля терминала в стоимости ниже коридора 20–55 % в тех же трёх клетках мира «Рыночный как есть» с режимом «Кризис»
    (3 % слоя «Свой макро-взгляд»): 19,0–19,3 %. Стоимость этих клеток ниже капитала на дату оценки (от −419 до
    +63 млрд ₽ при капитале 2 551 млрд ₽), и у таких клеток доля терминала считается к капиталу, а не к стоимости:
    убыток года шока съедает явный участок, и терминал несёт чуть меньше пятой части капитала. В остальных 33 клетках
    доля — от 23,6 до 52,2 %, внутри коридора.
  expected_mass: 0.03
  valid_until: 2026-11-30

cir_lt:
  explanation: >-
    Расходы к доходам (определение банка) в слое «Рыночные ставки как есть» в среднем за 2033–2036 годы — 38,7 % при
    цели книги 42 % ± 2 п.п., на 1,3 п.п. ниже коридора (модальная клетка — 39,3 %). Цель поставлена на составе баланса
    якоря; на пути при высоких ставках мира «Рыночный как есть» текущие счета и собственный капитал, за которые банк
    платит мало или не платит вовсе, приносят больше процентного дохода, и доходы растут быстрее расходов. Расходы
    книги заданы суждением о росте, а не подгонкой под отношение, поэтому отношение ниже цели — свойство состава
    баланса в мире высоких ставок.
  expected_mass: 1.0
  valid_until: 2026-11-30

volume_sign:
  explanation: >-
    Если снять остановку кредита в кризисе и поправки роста кредитов по режимам, точка снижается на 2,18 ₽ (64,04 →
    61,86 ₽): цена мира «Нормализация ставок» — на 0,21 ₽, мира «Высокие ставки надолго» — на 1,67 ₽, мира «Рыночный
    как есть» — на 2,95 ₽. Условие гейта — лишний рост точку не снижает, и в мире «Рыночный как есть» не хуже, чем в
    мире «Высокие ставки надолго»; у ВТБ нарушено и то и другое. Причина — доходность капитала ниже его стоимости:
    на конце сетки в клетке режима «Нормализация» она 15,0 % при стоимости 14,4 % в мире «Нормализация ставок», 16,7 %
    против 18,1 % в мире «Высокие ставки надолго» и 18,8 % против 22,1 % в мире «Рыночный как есть». Новый кредит в
    годы кризиса и спада не окупает стоимость капитала и отнимает стоимость — тем больше, чем выше ставки мира.
  expected_mass: 1.0
  valid_until: 2026-11-30

stress_sign:
  explanation: >-
    Гейт проверяет две вещи. Разовый убыток кризиса больше на 60 млрд ₽ стоимость клеток не повышает ни в одной клетке:
    стоимость падает на 0,70–1,02 ₽ на рубль убытка после налога — эта часть выполнена. Срабатывает вторая: при более
    высоком требовании к капиталу прибыль последнего года сетки выше в 24 клетках (все три мира и все режимы, сценарии
    «Средняя группа СЗКО» и «Жёсткий»; 64 % под вероятностями точки и столько же в слое «Свой макро-взгляд»), больше
    всего — на 194,6 млрд ₽ в мире «Рыночный как есть» при режиме «Мягкая посадка» и сценарии «Жёсткий» против сценария
    «По графику». Так устроена книга ВТБ: дивиденд — остаток над требованием, и чем выше требование, тем больше
    капитала банк оставляет у себя; оставленный капитал приносит процентный доход, и прибыль последнего года выше —
    следствие правила выплаты, а не ошибка знака.
  expected_mass: 0.64
  valid_until: 2026-11-30
