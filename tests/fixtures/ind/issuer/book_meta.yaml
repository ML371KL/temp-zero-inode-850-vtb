# Заглушка книги эмитента этой копии для тестов индикаторов: то, что индикаторы читают из книги (формат
# прил. A MODEL) — эмитент, дата фактов и первый квартал сетки, годовой календарь дивидендов, подписи реестра,
# периодов и целей нау-каста. Числа и даты сочинены для тестов.
meta:
  facts_date: "2026-06-30"
  first_period: "2026Q3"
  company:
    name: "ВТБ"
    tickers: [VTBR]
    main_ticker: VTBR
    cbr_regnum: 1000
    fiscal_year_end: "12-31"
  labels:
    register:
      collector_alarm: "нет записи реестра {label} к сроку решения ({end}): {detail} — проверить новости о решении собрания или внести `record-dividend` со ссылкой на документ эмитента"
    periods:
      "1": "за первый квартал {year} года"
      "2": "за полугодие {year} года"
      "3": "за девять месяцев {year} года"
      "4": "за {year} год"
    nowcast:
      targets:
        ni_q: {title: "Чистая прибыль группы за квартал", basis: ifrs, title_long: "Чистая прибыль группы по МСФО за квартал"}
        nim_q: {title: "ЧПМ квартала", basis: mgmt, title_long: "Чистая процентная маржа квартала в определении эмитента"}
        cor_q: {title: "Стоимость риска квартала", basis: mgmt, title_long: "Стоимость риска квартала в определении эмитента"}
dividends:
  calendar:
    frequency: annual
    agm_quarter: 2
checks:
  guidance_items: []
